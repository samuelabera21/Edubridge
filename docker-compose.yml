services:
  db:
    image: postgres:15-alpine
    container_name: edubridge_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_pass}
      POSTGRES_DB: ${POSTGRES_DB:-edubridge}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - edubridge_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: edubridge_backend
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres_user}:${POSTGRES_PASSWORD:-postgres_pass}@db:5432/${POSTGRES_DB:-edubridge}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-dev_secret_key}
      - DEFAULT_INITIAL_PASSWORD=${DEFAULT_INITIAL_PASSWORD:-initial_pass}
      # Set BETTER_AUTH_URL to the internal backend address so auth callbacks
      # and base URLs resolve correctly from inside the Docker network.
      - BETTER_AUTH_URL=http://backend:5000
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: edubridge_frontend
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${BACKEND_PORT:-5001}/api
      - BACKEND_URL=http://backend:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  edubridge_pgdata:
