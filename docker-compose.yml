services:
  db:
    image: postgres:15-alpine
    container_name: edubridge_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - edubridge_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: edubridge_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-edubridge_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-EduBridge@MinIO2024!}
      # Allow direct browser uploads from all local frontend origins
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:5001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - edubridge_minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - DEFAULT_INITIAL_PASSWORD=${DEFAULT_INITIAL_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Set BETTER_AUTH_URL to the internal backend address so auth callbacks
      # and base URLs resolve correctly from inside the Docker network.
      - BETTER_AUTH_URL=http://backend:5000
      # MinIO / Storage
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-edubridge_minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-EduBridge@MinIO2024!}
      - MINIO_BUCKET=${MINIO_BUCKET:-edubridge-documents}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db
      - minio
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: edubridge_frontend
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${BACKEND_PORT:-5001}/api
      - BACKEND_URL=http://backend:5000
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  edubridge_pgdata:
  edubridge_minio_data:
